// ── ProductImage — shows product photo or falls back to section icon ───────────
function ProductImage({ img, icon, size=44, radius=12 }) {
  const [err, setErr] = React.useState(false);

  const src = React.useMemo(() => {
    if (!img) return null;
    // Route Open Food Facts / Open Beauty Facts images through our Netlify proxy
    // to avoid CORS and tracking-prevention blocks
    const isOFF = img.includes("openfoodfacts") || img.includes("openbeautyfacts");
    if (isOFF) {
      // Use 400px thumbnail for speed
      const thumb = img.replace(/\.([a-z]+)$/, ".400.$1").replace(".400.400", ".400");
      return "/api/imgproxy?url=" + encodeURIComponent(thumb);
    }
    return img;
  }, [img]);

  if (src && !err) {
    return (
      <div style={{width:size,height:size,borderRadius:radius,overflow:"hidden",flexShrink:0,background:"#1C1C1E",position:"relative"}}>
        <img
          src={src}
          alt=""
          onError={()=>setErr(true)}
          style={{width:"100%",height:"100%",objectFit:"contain",display:"block",background:"#fff",padding:2,boxSizing:"border-box"}}
        />
      </div>
    );
  }
  // Fallback: section emoji in a styled box
  return (
    <div style={{width:size,height:size,borderRadius:radius,background:"#2C2C2E",display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.46,flexShrink:0}}>
      {icon}
    </div>
  );
}

function buildShopUrl(store, name, brand, buyNotes) {
  const q = encodeURIComponent([brand,name,buyNotes].filter(Boolean).join(" "));
  let rawUrl = store.url || "";
  // Safety: ensure absolute URL
  if (rawUrl && !/^https?:\/\//i.test(rawUrl)) rawUrl = "https://" + rawUrl;
  const web = rawUrl.replace(/\{q\}/g, q);
  const app = store.appUrl ? store.appUrl.replace(/\{q\}/g, q) : null;
  return { web, app };
}

// Open store: try native app first, fall back to web in new tab
function openStore(store, name, brand, buyNotes) {
  const { web, app } = buildShopUrl(store, name, brand, buyNotes);
  if (app) {
    // Try to open the app — if it fails after 1.5s, open web as fallback
    const start = Date.now();
    window.location.href = app;
    setTimeout(() => {
      // If we're still here (app didn't open), go to web
      if (Date.now() - start < 2000) {
        window.open(web, "_blank");
      }
    }, 1500);
  } else {
    window.open(web, "_blank");
  }
}

// Improved section guesser — snacks/crackers go to pantry, not pets
function guessSection(tags, name, customSections=[]) {
  const t = [...(tags||[]), name||""].join(" ").toLowerCase();
  // Check custom sections first (keyword matching on label)
  for (const cs of customSections) {
    if (cs.keywords?.some(kw => t.includes(kw.toLowerCase()))) return cs.id;
  }
  // Snack words that should NOT be pets
  if (/snack|cracker|chip|cookie|goldfish|pretzel|popcorn|candy|gummy|chocolate|granola|cereal|bar|nut|trail.mix/.test(t)) return "pantry";
  if (/vitamin|supplement|protein.powder|medicine|capsule|tablet|ibuprofen|tylenol|advil|pain|cold|flu|allerg/.test(t)) return "medicine";
  if (/shampoo|conditioner|body.wash|deodorant|toothpaste|razor|floss|soap|lotion/.test(t)) return "toiletries";
  if (/makeup|lipstick|mascara|foundation|concealer|serum|moisturiz|eye.shadow|blush|nail/.test(t)) return "makeup";
  if (/dish.soap|laundry|bleach|disinfect|clean|wipe|scrub|mop|broom|sponge/.test(t)) return "cleaning";
  if (/frozen|ice.cream|popsicle/.test(t)) return "freezer";
  if (/milk|cheese|yogurt|butter|egg|produce|fruit|vegetable|juice|deli|meat|chicken|beef|pork/.test(t)) return "fridge";
  if (/paper.towel|toilet.paper|tissue|napkin|trash.bag|aluminum.foil|plastic.wrap/.test(t)) return "paper";
  if (/dog.food|cat.food|pet.treat|kibble|litter|aquarium|bird.seed/.test(t)) return "pets";
  if (/pen|pencil|staple|paper.clip|binder|folder|tape|scissors|notebook|printer|ink|toner|office/.test(t)) return "office";
  if (/drill|screw|nail|bolt|nut|washer|hammer|wrench|plier|saw|lumber|pipe|wire|outlet|switch|paint|caulk|grout|tile|drywall|insulation|ladder|sandpaper|level|anchor|hinge|latch|faucet|valve|pvc|conduit|hardware/.test(t)) return "hardware";
  if (/shirt|pant|sock|underwear|dress|shoe|jacket|coat|hat|scarf|clothing|apparel|laundry.basket/.test(t)) return "closet";
  return "pantry";
}

async function lookupUPC(upc, customSections=[]) {
  const go = (url) => {
    const ctrl = new AbortController();
    setTimeout(()=>ctrl.abort(), 7000);
    return fetch(url, {signal:ctrl.signal});
  };
  // Try Open Food Facts first
  try {
    const r = await go(`https://world.openfoodfacts.org/api/v0/product/${upc}.json`);
    const d = await r.json();
    if (d.status===1 && d.product) {
      const p = d.product;
      // Pick best image: front thumbnail first, then full front, then any image
      const img = p.image_front_small_url || p.image_front_url || p.image_small_url || p.image_url || null;
      const sec1=guessSection(p.categories_tags,p.product_name,customSections); return { name:p.product_name||"", brand:p.brands?.split(",")[0]?.trim()||"", section:sec1, subcat:guessSubcat(sec1,p.product_name,p.brands), notes:p.quantity||"", upc, img };
    }
  } catch(_){}
  // Try Open Beauty Facts (toiletries, makeup, medicine)
  try {
    const r = await go(`https://world.openbeautyfacts.org/api/v0/product/${upc}.json`);
    const d = await r.json();
    if (d.status===1 && d.product) {
      const p = d.product;
      const img = p.image_front_small_url || p.image_front_url || p.image_url || null;
      const sec2=guessSection(p.categories_tags,p.product_name,customSections); return { name:p.product_name||"", brand:p.brands?.split(",")[0]?.trim()||"", section:sec2, subcat:guessSubcat(sec2,p.product_name,p.brands), notes:p.quantity||"", upc, img };
    }
  } catch(_){}
  // Fallback to UPC Item DB — also returns images[]
  try {
    const r2 = await go(`https://api.upcitemdb.com/prod/trial/lookup?upc=${upc}`);
    const d2 = await r2.json();
    if (d2.items?.[0]) {
      const it = d2.items[0];
      const img = it.images?.[0] || null;
      // UPC Item DB has better size/weight data
      const notes = [it.size, it.weight].filter(Boolean).join(", ") || "";
      const sec3=guessSection([],it.title,customSections); return { name:it.title||"", brand:it.brand||"", section:sec3, subcat:guessSubcat(sec3,it.title,it.brand), notes, upc, img };
    }
  } catch(_){}
  return null;
}

// ── Scanner ────────────────────────────────────────────────────────────────────
function Scanner({ onResult, onClose }) {
  const containerRef = useRef(null);
  const [phase, setPhase]   = useState("init");
  const [errMsg, setErrMsg] = useState("");
  const [manual, setManual] = useState("");
  const detectedRef = useRef(false);
  const quaggaStarted = useRef(false);

  // Stop camera helper
  const stopCamera = useCallback(() => {
    if (window.Quagga && quaggaStarted.current) {
      try { window.Quagga.stop(); } catch(_){}
      quaggaStarted.current = false;
    }
  }, []);

  const handleClose = useCallback(() => {
    stopCamera();
    onClose();
  }, [stopCamera, onClose]);

  useEffect(() => {
    let mounted = true;

    const loadAndStart = async () => {
      if (!window.Quagga) {
        try {
          await new Promise((res, rej) => {
            const s = document.createElement("script");
            s.src = "https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js";
            s.onload = res;
            s.onerror = () => rej(new Error("Scanner library failed to load"));
            document.head.appendChild(s);
          });
        } catch(e) {
          if (mounted) { setErrMsg(e.message); setPhase("error"); }
          return;
        }
      }
      if (!mounted || !containerRef.current) return;

      window.Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: containerRef.current,
          constraints: { facingMode: "environment", width:{ideal:1280}, height:{ideal:720} },
        },
        decoder: {
          readers: ["upc_reader","upc_e_reader","ean_reader","ean_8_reader","code_128_reader"],
        },
        locate: true,
      }, (err) => {
        if (!mounted) return;
        if (err) {
          const msg = err.message || String(err);
          if (/permission|denied|notallowed/i.test(msg)) {
            setErrMsg("Camera permission denied.\n\nTo fix: in your browser's address bar, tap the lock/camera icon and allow camera access, then reload.");
          } else if (/device|found|notfound/i.test(msg)) {
            setErrMsg("No camera found on this device.");
          } else {
            setErrMsg("Could not start camera: " + msg);
          }
          setPhase("error");
          return;
        }
        if (mounted) {
          quaggaStarted.current = true;
          window.Quagga.start();
          setPhase("live");
        }
      });

      window.Quagga.onDetected((data) => {
        if (!mounted || detectedRef.current) return;
        const code = data?.codeResult?.code;
        if (code && code.length >= 6) {
          detectedRef.current = true;
          stopCamera();
          onResult(code);
        }
      });
    };

    loadAndStart();
    return () => {
      mounted = false;
      stopCamera();
    };
  }, [onResult, stopCamera]);

  const submit = () => { const v = (manual||"").trim(); if (v.length >= 4) { stopCamera(); onResult(v); } };

  return (
    <div style={{position:"fixed",inset:0,zIndex:1000,background:"#000",display:"flex",flexDirection:"column"}}>
      {/* Top bar — extra padding to clear notch/status bar */}
      <div style={{
        paddingTop:"max(52px, env(safe-area-inset-top, 52px))",
        paddingLeft:20, paddingRight:20, paddingBottom:16,
        display:"flex", justifyContent:"space-between", alignItems:"center",
        background:"rgba(0,0,0,.9)", flexShrink:0, zIndex:10
      }}>
        <div>
          <div style={{fontSize:22,fontWeight:800,color:"#fff"}}>Scan Barcode</div>
          <div style={{fontSize:14,color:"rgba(255,255,255,.5)",marginTop:2}}>
            {phase==="live"?"Aim at the barcode on the product":phase==="init"?"Starting camera…":""}
          </div>
        </div>
        {/* Big, clearly visible close button */}
        <button
          onClick={handleClose}
          style={{
            minWidth:56, height:56, borderRadius:16,
            background:"rgba(255,255,255,.2)", border:"2px solid rgba(255,255,255,.4)",
            color:"#fff", fontSize:26, fontWeight:800, cursor:"pointer",
            display:"flex", alignItems:"center", justifyContent:"center",
            WebkitTapHighlightColor:"transparent",
          }}>
          ✕
        </button>
      </div>

      {/* Camera viewport */}
      <div style={{flex:1,position:"relative",overflow:"hidden",background:"#111"}}>
        <div ref={containerRef} id="interactive" className="viewport"
          style={{width:"100%",height:"100%",position:"relative"}}/>

        {phase==="live" && (
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.35)"}}/>
            <div style={{position:"relative",width:"85%",maxWidth:340,height:160,zIndex:2}}>
              <div style={{position:"absolute",inset:0,boxShadow:"0 0 0 9999px rgba(0,0,0,.5)",borderRadius:14}}/>
              {[
                {top:0,left:0,borderTop:"3px solid #fff",borderLeft:"3px solid #fff",borderRadius:"10px 0 0 0"},
                {top:0,right:0,borderTop:"3px solid #fff",borderRight:"3px solid #fff",borderRadius:"0 10px 0 0"},
                {bottom:0,left:0,borderBottom:"3px solid #fff",borderLeft:"3px solid #fff",borderRadius:"0 0 0 10px"},
                {bottom:0,right:0,borderBottom:"3px solid #fff",borderRight:"3px solid #fff",borderRadius:"0 0 10px 0"},
              ].map((s,i)=><div key={i} style={{position:"absolute",width:28,height:28,...s}}/>)}
              <div style={{position:"absolute",left:4,right:4,height:2,background:"rgba(255,255,255,.9)",boxShadow:"0 0 10px rgba(255,255,255,.7)",animation:"scanLine 2s ease-in-out infinite"}}/>
            </div>
            <div style={{position:"relative",zIndex:3,marginTop:24,color:"rgba(255,255,255,.7)",fontSize:14,fontWeight:600}}>Keep barcode inside the frame</div>
          </div>
        )}

        {phase==="init" && (
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
            <div style={{width:52,height:52,border:"4px solid rgba(255,255,255,.15)",borderTop:"4px solid #fff",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
            <div style={{color:"rgba(255,255,255,.5)",fontSize:15}}>Starting camera…</div>
          </div>
        )}

        {phase==="error" && (
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:32,textAlign:"center"}}>
            <div style={{fontSize:56}}>📷</div>
            <div style={{color:"#F87171",fontWeight:800,fontSize:18}}>Camera unavailable</div>
            <div style={{color:"rgba(255,255,255,.6)",fontSize:14,lineHeight:1.7,whiteSpace:"pre-line"}}>{errMsg}</div>
            <div style={{marginTop:8,background:"rgba(255,255,255,.08)",borderRadius:14,padding:"14px 18px",textAlign:"left",fontSize:13,color:"rgba(255,255,255,.5)",lineHeight:1.6}}>
              <strong style={{color:"rgba(255,255,255,.7)"}}>Camera permission tip:</strong>{"\n"}
              Browsers only ask for camera permission once. To reset it:{"\n"}
              • <strong>iOS Safari:</strong> Settings → Safari → Camera → Allow{"\n"}
              • <strong>Chrome:</strong> tap 🔒 in address bar → Site Settings → Camera
            </div>
            <button onClick={()=>setPhase("manual")} style={{background:"#fff",border:"none",borderRadius:16,padding:"14px 28px",color:"#000",fontSize:16,fontWeight:800,cursor:"pointer",marginTop:4}}>
              Type barcode instead
            </button>
          </div>
        )}
      </div>

      {/* Bottom bar */}
      <div style={{background:"rgba(0,0,0,.9)",padding:"16px 20px",paddingBottom:"max(24px,env(safe-area-inset-bottom))",flexShrink:0}}>
        {phase==="manual" ? (
          <div style={{display:"flex",gap:10}}>
            <input autoFocus value={manual} onChange={e=>setManual(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
              placeholder="Type barcode number…" inputMode="numeric"
              style={{flex:1,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",borderRadius:14,padding:"16px 18px",color:"#fff",fontSize:18,outline:"none"}}/>
            <button onClick={submit} style={{background:"#fff",border:"none",borderRadius:14,padding:"16px 22px",color:"#000",fontSize:17,fontWeight:800,cursor:"pointer"}}>Go</button>
          </div>
        ) : (
          <button onClick={()=>setPhase("manual")} style={{width:"100%",background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",borderRadius:14,padding:"16px",color:"rgba(255,255,255,.6)",fontSize:15,cursor:"pointer",fontWeight:600}}>
            ✏️  Type barcode manually instead
          </button>
        )}
      </div>
      <style>{`
        @keyframes scanLine{0%,100%{top:8px}50%{top:138px}}
        @keyframes spin{to{transform:rotate(360deg)}}
        #interactive.viewport{width:100%;height:100%;position:relative;}
        #interactive.viewport canvas,#interactive.viewport video{width:100%!important;height:100%!important;object-fit:cover;position:absolute;top:0;left:0;}
        canvas.drawingBuffer{display:none!important;}
      `}</style>
    </div>
  );
}

// ── AI Vision Sheet ────────────────────────────────────────────────────────────
// ── InventorySuggestionsSheet — AI suggestions based on actual pantry items ────
function InventorySuggestionsSheet({ items, allSections, onClose, apiKey }) {
  const [phase,   setPhase]   = useState("idle"); // idle | thinking | done | error
  const [result,  setResult]  = useState(null);
  const [errMsg,  setErrMsg]  = useState("");

  const getSuggestions = async () => {
    if (!apiKey?.trim()) {
      setErrMsg("No API key set. Tap ✨ in the header to open Settings.");
      setPhase("error"); return;
    }
    setPhase("thinking");
    setResult(null);

    // Build a clean inventory summary to send — no need to send images, just names
    const inventory = items.map(i => {
      const parts = [i.brand, i.name, i.notes].filter(Boolean).join(" ");
      const sec = allSections.find(s => s.id === i.section);
      return `${parts}${sec ? " ["+sec.label+"]" : ""}`;
    }).join("\n");

    const prompt = `You are a helpful pantry assistant. Here is someone's current pantry inventory:

${inventory}

Based ONLY on what they already have, suggest 6-8 items they should consider buying next. Think about:
- What recipes could they make with what they have, and what's the one missing ingredient?
- What staples are commonly paired with items they have?
- What complementary items round out their pantry?

Rules:
- ONLY suggest items NOT already in their inventory
- Every suggestion must be something a person could immediately search for on Walmart or Target
- Be specific: "Marinara Sauce" not "sauce", "Garlic Powder" not "spices"
- Include a SHORT reason (max 8 words) tied to a specific item they have
- No vague suggestions like "pantry staples" or "kitchen essentials"

Return ONLY a JSON array, no markdown:
[{"name": "specific product", "reason": "because you have X"}, ...]`;

    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5",
          max_tokens: 800,
          messages: [{ role: "user", content: prompt }]
        })
      });

      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error?.message || "API error");
      const raw = data.content?.find(c => c.type === "text")?.text || "";
      const match = raw.match(/\[[\s\S]*\]/);
      if (!match) throw new Error("Could not parse response.");
      setResult(JSON.parse(match[0]));
      setPhase("done");
    } catch(e) {
      setErrMsg(e.message);
      setPhase("error");
    }
  };

  // Auto-trigger on open
  React.useEffect(() => { getSuggestions(); }, []);

  return (
    <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)"}} onClick={onClose}/>
      <div style={{position:"relative",background:"#2C2C2E",borderRadius:"28px 28px 0 0",maxHeight:"88vh",display:"flex",flexDirection:"column",paddingBottom:"max(24px,env(safe-area-inset-bottom))"}}>
        <div style={{padding:"14px 20px 0",flexShrink:0}}>
          <div style={{width:44,height:5,background:"#4A4A4E",borderRadius:3,margin:"0 auto 18px"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <div style={{fontSize:22,fontWeight:800,color:"#fff"}}>Suggestions ✨</div>
              <div style={{fontSize:13,color:"#636366",marginTop:3}}>Based on your {items.length} pantry items</div>
            </div>
            <button onClick={onClose} style={{width:44,height:44,borderRadius:22,background:"#3A3A3C",border:"none",color:"#8E8E93",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
        </div>

        <div style={{flex:1,overflowY:"auto",padding:"0 20px 12px"}}>
          {/* Thinking state */}
          {phase==="thinking" && (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"48px 20px",gap:16}}>
              <div style={{width:44,height:44,border:"4px solid rgba(255,255,255,.1)",borderTop:"4px solid #7C3AED",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
              <div style={{color:"#8E8E93",fontSize:15}}>Analyzing your pantry…</div>
            </div>
          )}

          {/* Error state */}
          {phase==="error" && (
            <div style={{background:"#2D0A0A",border:"1px solid #F8717150",borderRadius:14,padding:"14px 16px",marginBottom:16}}>
              <div style={{color:"#F87171",fontWeight:700,marginBottom:4}}>Could not get suggestions</div>
              <div style={{color:"rgba(255,255,255,.6)",fontSize:13,wordBreak:"break-word"}}>{errMsg}</div>
              <button onClick={getSuggestions} style={{marginTop:12,padding:"10px 18px",borderRadius:10,background:"#3A3A3C",border:"none",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>Try Again</button>
            </div>
          )}

          {/* Results */}
          {phase==="done" && result && (
            <div>
              {result.map((s, i) => (
                <div key={i} style={{background:"#1C1C1E",borderRadius:14,padding:"14px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:40,height:40,borderRadius:12,background:"#7C3AED20",border:"1px solid #7C3AED40",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>✨</div>
                  <div style={{flex:1}}>
                    <div style={{color:"#fff",fontWeight:800,fontSize:15}}>{s.name}</div>
                    <div style={{color:"#8E8E93",fontSize:12,marginTop:3}}>{s.reason}</div>
                  </div>
                </div>
              ))}
              <button onClick={getSuggestions}
                style={{width:"100%",padding:"14px",borderRadius:14,background:"#1C1C1E",border:"1px solid #3A3A3C",color:"#7C3AED",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:4}}>
                ↺ Refresh Suggestions
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function AIVisionSheet({ allSections, onAddItems, onClose, apiKey }) {
  const cameraRef = useRef(null);
  const uploadRef  = useRef(null);
  const [phase,    setPhase]    = useState("idle"); // idle | analyzing | done | error
  const [preview,  setPreview]  = useState(null);
  const [result,   setResult]   = useState(null);
  const [errMsg,   setErrMsg]   = useState("");
  const [selected, setSelected] = useState({});
  const [editing,  setEditing]  = useState({});
  const [scanMode, setScanMode] = useState("pantry"); // "pantry" | "cart"

  const analyze = async (file) => {
    if (!apiKey || !apiKey.trim()) {
      setErrMsg("No API key set. Tap ✨ in the header → enter your Anthropic API key in Settings.");
      setPhase("error");
      return;
    }
    setPhase("analyzing");
    try {
      // Resize + compress image before sending to API
      // Phone photos are 3-12MB; we only need ~800px for label recognition
      // This reduces cost by ~70-85% with zero quality loss for text/label reading
      const { b64, mimeType } = await new Promise((res, rej) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          const MAX = 1024; // px on longest side — enough to read labels clearly
          const scale = Math.min(1, MAX / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          // Slight sharpening to help with label text at smaller size
          ctx.filter = "contrast(1.05) saturate(1.1)";
          ctx.drawImage(img, 0, 0, w, h);
          // JPEG at 0.82 quality — sharp enough for text, small enough to be cheap
          const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
          res({ b64: dataUrl.split(",")[1], mimeType: "image/jpeg" });
        };
        img.onerror = rej;
        img.src = objectUrl;
      });

      const prompt = `You are a strict pantry inventory assistant. Your job is to return ONLY products you can specifically identify.

IDENTIFY and include:
- Products where you can read the name on the label (Cheerios, Heinz Ketchup, Tide Pods)
- Products where the brand logo is clearly visible (Organic Valley milk, Campbell's soup)
- Unpackaged/unlabeled items where the contents are unambiguous (white rice in clear jar, bananas, apples)
- Generic staples that are obvious even without a label (eggs, butter, whole milk)

DO NOT include:
- Anything you can only describe by color, position, or container shape ("yellow bottle", "red can on left shelf", "green box")
- Partially visible items where you cannot determine what they are
- Items where you are guessing — if unsure, skip it entirely

PRODUCT NAME rules:
- Name = the actual product (e.g. "Whole Milk", "Chicken Noodle Soup", "Frosted Flakes")
- Brand = the brand only (e.g. "Organic Valley", "Campbell's", "Kellogg's")
- Notes = size or variant ONLY if it adds useful info ("1 gallon", "Family Size") — NO color descriptions, NO shelf location, NO packaging descriptions
- BAD notes example: "red carton, left side of shelf" — never do this
- GOOD notes example: "1 gallon" or "Low Sodium" or leave blank

Return a JSON array. Only include items you can specifically identify:
{ "name": "product name", "brand": "brand or empty", "notes": "size/variant only, or empty", "section": one of [fridge,pantry,freezer,cleaning,toiletries,makeup,medicine,paper,pets,office,closet,other] }

If you cannot identify something specifically enough that someone could search for it on Walmart.com, leave it out entirely.
Return ONLY the JSON array, no markdown, no explanation.`;

      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({
          model:"claude-haiku-4-5",
          max_tokens:2000,
          messages:[{
            role:"user",
            content:[
              { type:"image", source:{type:"base64", media_type:mimeType, data:b64} },
              { type:"text",  text:prompt }
            ]
          }]
        })
      });

      // Always parse the response first so we can show the real error
      const data = await resp.json();

      // API returned an error object
      if (!resp.ok || data.error) {
        const err = data.error || {};
        const type = err.type || "";
        const msg  = err.message || `HTTP ${resp.status}`;
        if (type === "authentication_error")
          throw new Error("Invalid API key. Double-check it in Settings (✨).");
        if (type === "insufficient_quota" || /credit|quota|billing/i.test(msg))
          throw new Error("Insufficient credits. Go to console.anthropic.com → Billing to top up.");
        if (type === "rate_limit_error")
          throw new Error("Rate limit hit — wait a few seconds and try again.");
        if (type === "overloaded_error")
          throw new Error("Anthropic servers are busy — try again in a moment.");
        throw new Error(`API error (${type||resp.status}): ${msg}`);
      }

      const rawText = data.content?.find(c=>c.type==="text")?.text || "";
      if (!rawText) throw new Error("API returned an empty response. Try again.");

      // Strip markdown fences and extract JSON even if there's surrounding text
      const jsonMatch = rawText.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
      if (!jsonMatch) throw new Error("Could not parse response. Raw: " + rawText.slice(0,200));
      const parsed = JSON.parse(jsonMatch[1]);

      // Client-side filter: remove items that are just vague physical descriptions
      // These slip through even with good prompts
      const isVague = (item) => {
        const combined = ((item.name||"") + " " + (item.brand||"")).toLowerCase();
        // Reject if name contains positional/color/container words with no real product name
        const vaguePatterns = [
          /(left|right|top|bottom|front|back|middle|corner|shelf|side)/,
          /(bottle|jar|can|box|bag|container|package|item|object|thing|product)\s*(on|at|in|to|the)/,
          /^(unknown|unidentified|unlabeled|unclear|blurry|partial)/,
        ];
        const hasVague = vaguePatterns.some(p => p.test(combined));
        // Also reject if name is only a color + container description
        const colorContainer = /^(red|blue|green|yellow|white|black|brown|orange|purple|pink)\s+(bottle|can|box|jar|bag|container|package)/.test(combined);
        return hasVague || colorContainer;
      };

      const filtered = Array.isArray(parsed) ? parsed.filter(item => !isVague(item)) : parsed;
      setResult(filtered);
      if (Array.isArray(filtered)) {
        const sel = {};
        const edits = {};
        filtered.forEach((item,i) => { sel[i]=true; edits[i]={...item}; });
        setSelected(sel);
        setEditing(edits);
      }
      setPhase("done");
    } catch(e) {
      // Surface the real error — never show a blank or generic message
      const msg = e.message || String(e) || "Unknown error";
      // Common: network blocked (CORS / no internet)
      const netErr = msg.toLowerCase().includes("fetch") || msg.toLowerCase().includes("network") || msg.toLowerCase().includes("failed to fetch");
      setErrMsg(netErr
        ? "Network error — check your internet connection. If using a VPN or restrictive network, try disabling it."
        : msg
      );
      setPhase("error");
    }
  };

  const handleFile = (file) => {
    if (!file) return;
    const url = URL.createObjectURL(file);
    setPreview(url);
    setResult(null);
    setPhase("idle");
    analyze(file);
  };

  const addSelected = () => {
    if (!Array.isArray(result)) return;
    const toAdd = result
      .filter((_,i) => selected[i])
      .map((_,i) => ({
        ...(editing[i] || result[i]),
        id: Date.now() + Math.random() * 1000,
        status: scanMode === "cart" ? "out" : "ok",
        stores:[],
        lastUpdated: new Date().toISOString(),
      }));
    onAddItems(toAdd);
    onClose();

    setEditing(cs.id);
    setForm({label:cs.label, icon:cs.icon, accent:cs.accent, keywords:(cs.keywords||[]).join(", ")});

  const save = () => {
    if (!form.label.trim()) return;
    const kws = form.keywords.split(",").map(s=>s.trim()).filter(Boolean);
    if (editing) {
      setCustomSections(p=>p.map(s=>s.id===editing?{...s,...form,keywords:kws}:s));

// ── ImageSearchRow — live image search inside item edit form ──────────────────
function ImageSearchRow({ f, upd }) {
  const [status, setStatus] = React.useState("idle"); // idle | searching | found | none
  const [candidates, setCandidates] = React.useState([]);

  const search = async () => {
    const q = [f.brand, f.name].filter(Boolean).join(" ").trim();
    if (!q) return;
    setStatus("searching");
    setCandidates([]);
    try {
      // Try Open Food Facts text search first
      const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=5`);
      const d = await r.json();
      const imgs = (d.products||[])
        .map(p => p.image_front_small_url || p.image_front_url || null)
        .filter(Boolean);
      if (imgs.length) { setCandidates(imgs); setStatus("found"); return; }

      // Fallback: Open Beauty Facts
      const r2 = await fetch(`https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=5`);
      const d2 = await r2.json();
      const imgs2 = (d2.products||[])
        .map(p => p.image_front_small_url || p.image_front_url || null)
        .filter(Boolean);
      if (imgs2.length) { setCandidates(imgs2); setStatus("found"); return; }

      setStatus("none");
    } catch(_) { setStatus("none"); }
  };

  const proxyUrl = (img) => {
    if (!img) return img;
    const isOFF = img.includes("openfoodfacts") || img.includes("openbeautyfacts");
    if (isOFF) return "/api/imgproxy?url=" + encodeURIComponent(img);
    return img;
  };

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
        {f.img ? (
          <div style={{width:52,height:52,borderRadius:12,overflow:"hidden",background:"#fff",flexShrink:0}}>
            <img src={proxyUrl(f.img)} alt="" style={{width:"100%",height:"100%",objectFit:"contain"}} onError={e=>e.target.style.display="none"}/>
          </div>
        ) : (
          <div style={{width:52,height:52,borderRadius:12,background:"#2C2C2E",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>📷</div>
        )}
        <div style={{flex:1}}>
          <div style={{fontSize:12,color:"#8E8E93",marginBottom:6,fontWeight:600,textTransform:"uppercase",letterSpacing:".05em"}}>Product Image</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={search} disabled={status==="searching"}
              style={{flex:1,padding:"9px 12px",borderRadius:10,background:"#1C1C1E",border:"1px solid #3A3A3C",color:status==="searching"?"#636366":"#0A84FF",fontSize:13,fontWeight:700,cursor:"pointer"}}>
              {status==="searching" ? "Searching…" : "🔍 Find Image"}
            </button>
            {f.img && (
              <button onClick={()=>upd("img",null)}
                style={{padding:"9px 12px",borderRadius:10,background:"#1C1C1E",border:"1px solid #3A3A3C",color:"#F87171",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                ✕
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Image picker strip */}
      {candidates.length > 0 && (
        <div>
          <div style={{fontSize:11,color:"#636366",marginBottom:8}}>Tap to use:</div>
          <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>
            {candidates.map((img,i) => (
              <div key={i} onClick={()=>{ upd("img", img); setCandidates([]); setStatus("idle"); }}
                style={{width:64,height:64,borderRadius:10,overflow:"hidden",flexShrink:0,background:"#fff",cursor:"pointer",border:`2px solid ${f.img===img?"#0A84FF":"transparent"}`,transition:"border .1s"}}>
                <img src={proxyUrl(img)} alt="" style={{width:"100%",height:"100%",objectFit:"contain"}}
                  onError={e=>e.target.parentElement.style.display="none"}/>
              </div>
            ))}
          </div>
        </div>
      )}
      {status==="none" && <div style={{fontSize:12,color:"#636366",marginTop:4}}>No images found — try adjusting the brand or product name.</div>}
    </div>
  );
}

// ── ItemSheet ──────────────────────────────────────────────────────────────────
const BLANK = { name:"", brand:"", section:"pantry", subcat:"", status:"ok", stores:[], notes:"", buyNotes:"", upc:"" };

function ItemSheet({ existing, allStores, allSections, onSave, onDelete, onClose, onOpenScanner }) {
  const [f, setF] = useState(() => existing ? {...existing} : {...BLANK});
  const [looking, setLooking] = useState(false);
  const [lookMsg, setLookMsg] = useState("");
  useEffect(() => { setF(existing ? {...existing} : {...BLANK}); }, [existing?.id]);
  const upd = (k,v) => setF(p=>({...p,[k]:v}));
  const toggleStore = id => setF(p=>({...p, stores: p.stores.includes(id) ? p.stores.filter(x=>x!==id) : [...p.stores,id]}));

  const doLookup = async () => {
    if (!(f.upc||"").trim()) return;
    setLooking(true); setLookMsg("Looking up…");
    const r = await lookupUPC((f.upc||"").trim());
    if (r) {
      setF(p=>({...p, name:r.name||p.name, brand:r.brand||p.brand, section:r.section||p.section, notes:r.notes||p.notes}));
      setLookMsg("✓ Product found!");
    } else {
      setLookMsg("Not found — fill in manually");
    }
    setLooking(false);
  };

  const save = () => {
    if (!(f.name||"").trim()) return;
    onSave({...f, id:f.id||Date.now(), lastUpdated:new Date().toISOString()});
    onClose();
  };

  const iStyle = {width:"100%",background:"#1C1C1E",border:"1.5px solid #3A3A3C",borderRadius:14,padding:"16px 18px",color:"#fff",fontSize:17,outline:"none",boxSizing:"border-box",WebkitAppearance:"none"};
  const lbl = {fontSize:13,fontWeight:700,color:"#8E8E93",letterSpacing:".07em",textTransform:"uppercase",marginBottom:10,display:"block"};

  return (
    <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.65)"}} onClick={onClose}/>
      <div style={{position:"relative",background:"#2C2C2E",borderRadius:"28px 28px 0 0",maxHeight:"94vh",display:"flex",flexDirection:"column",paddingBottom:"max(24px,env(safe-area-inset-bottom))"}}>
        <div style={{padding:"14px 20px 0",flexShrink:0}}>
          <div style={{width:44,height:5,background:"#4A4A4E",borderRadius:3,margin:"0 auto 18px"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              {(f.img) && <ProductImage img={f.img} icon={"📦"} size={52} radius={12}/>}
              <div style={{fontSize:22,fontWeight:800,color:"#fff"}}>{existing?.id ? "Edit Item" : "Add New Item"}</div>
            </div>
            <button onClick={onClose} style={{width:44,height:44,borderRadius:22,background:"#3A3A3C",border:"none",color:"#8E8E93",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
        </div>

        <div style={{overflowY:"auto",flex:1,padding:"0 20px",display:"flex",flexDirection:"column",gap:20}}>
          {/* Barcode */}
          <div>
            <span style={lbl}>Barcode (optional)</span>
            <div style={{display:"flex",gap:10}}>
              <input value={f.upc||""} onChange={e=>{upd("upc",e.target.value);setLookMsg("");}}
                placeholder="Scan or type barcode" inputMode="numeric" style={{...iStyle,flex:1}}/>
              <button onClick={()=>onOpenScanner(f)}
                style={{width:54,height:54,borderRadius:14,background:"#0A84FF",border:"none",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <ScanIcon size={26} color="#fff"/>
              </button>
            </div>
            {(f.upc||"").trim().length > 4 && (
              <button onClick={doLookup} disabled={looking}
                style={{marginTop:10,width:"100%",padding:"14px",background:"#0A84FF15",border:"1px solid #0A84FF40",borderRadius:14,color:"#0A84FF",fontSize:16,fontWeight:700,cursor:"pointer"}}>
                {looking ? "Looking up…" : "🔍 Look up product info"}
              </button>
            )}
            {lookMsg && <div style={{marginTop:8,fontSize:14,color:lookMsg.startsWith("✓")?"#34D399":"#FBBF24",fontWeight:600}}>{lookMsg}</div>}
          </div>

          <div><span style={lbl}>Product Name *</span><input value={f.name||""} onChange={e=>upd("name",e.target.value)} placeholder="e.g. Toilet Paper" style={iStyle}/></div>
          <div><span style={lbl}>Brand</span><input value={f.brand||""} onChange={e=>upd("brand",e.target.value)} placeholder="e.g. Charmin" style={iStyle}/></div>
          {/* Image search row */}
          <ImageSearchRow f={f} upd={upd}/>
          <div>
            <span style={lbl}>General Notes <span style={{fontWeight:400,textTransform:"none",letterSpacing:0}}>(size, scent, flavor…)</span></span>
            <input value={f.notes||""} onChange={e=>upd("notes",e.target.value)} placeholder="e.g. Ultra Soft, 18 rolls" style={iStyle}/>
          </div>

          <div>
            <span style={lbl}>Preferred Buy <span style={{fontWeight:400,textTransform:"none",letterSpacing:0}}>(added to store search — be specific)</span></span>
            <input value={f.buyNotes||""} onChange={e=>upd("buyNotes",e.target.value)}
              placeholder="e.g. 32 oz, unscented, family size, original"
              style={iStyle}/>
            {(f.buyNotes||"").trim() && (
              <div style={{marginTop:8,background:"#1C1C1E",borderRadius:10,padding:"9px 12px",display:"flex",alignItems:"center",gap:8}}>
                <div style={{fontSize:12,color:"#636366"}}>Search will be:</div>
                <div style={{fontSize:13,fontWeight:700,color:"#0A84FF",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {[f.brand,f.name,f.buyNotes].filter(Boolean).join(" ")}
                </div>
              </div>
            )}
          </div>

          <div>
            <span style={lbl}>Where does it live?</span>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {allSections.map(s=>{
                const on = f.section===s.id;
                return (
                  <button key={s.id} onClick={()=>upd("section",s.id)}
                    style={{padding:"11px 14px",borderRadius:14,background:on?`${s.accent}20`:"#1C1C1E",border:`2px solid ${on?s.accent:"#3A3A3C"}`,color:on?s.accent:"#8E8E93",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:17}}>{s.icon}</span>{s.label}
                  </button>
                );
              })}
            </div>
          </div>



          {/* Subcategory chips — only shown when section has subcategories */}
          {(SUBCATEGORIES[f.section]||[]).length > 0 && (
            <div>
              <span style={lbl}>Subcategory</span>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {(SUBCATEGORIES[f.section]||[]).map(sc=>(
                  <button key={sc} onClick={()=>upd("subcat", f.subcat===sc?"":sc)}
                    style={{padding:"9px 14px",borderRadius:20,background:f.subcat===sc?"#0A84FF":"#1C1C1E",border:`1.5px solid ${f.subcat===sc?"#0A84FF":"#3A3A3C"}`,color:f.subcat===sc?"#fff":"#8E8E93",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
                    {sc}
                  </button>
                ))}
              </div>
            </div>
          )}

          {allStores.length > 0 && (
            <div>
              <span style={lbl}>Buy from</span>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {allStores.map(s=>{
                  const on = f.stores.includes(s.id);
                  return (
                    <button key={s.id} onClick={()=>toggleStore(s.id)}
                      style={{padding:"11px 14px",borderRadius:14,background:on?`${s.color}20`:"#1C1C1E",border:`2px solid ${on?s.color:"#3A3A3C"}`,color:on?s.color:"#8E8E93",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontSize:17}}>{s.emoji}</span>{s.name}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          <button onClick={save}
            style={{width:"100%",padding:"18px",borderRadius:18,background:(f.name||"").trim()?"#0A84FF":"#3A3A3C",border:"none",color:(f.name||"").trim()?"#fff":"#636366",fontSize:18,fontWeight:800,cursor:(f.name||"").trim()?"pointer":"default"}}>
            {existing?.id ? "Save Changes" : "Add to Pantry ✓"}
          </button>

          {existing?.id && (
            <button onClick={()=>{onDelete(existing.id); onClose();}}
              style={{width:"100%",padding:"16px",borderRadius:18,background:"#FF453A15",border:"1px solid #FF453A40",color:"#FF453A",fontSize:16,fontWeight:700,cursor:"pointer",marginBottom:8}}>
              Delete Item
            </button>
          )}
          <div style={{height:8}}/>
        </div>
      </div>
    </div>
  );
}

// ── BuySheet ───────────────────────────────────────────────────────────────────
function BuySheet({ item, allStores, onClose, onStoreChosen }) {
  if (!item) return null;
  const linked = (item.stores||[]).map(id=>allStores.find(s=>s.id===id)).filter(Boolean);
  const show = linked.length ? linked : allStores;
  return (
    <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.65)"}} onClick={onClose}/>
      <div style={{position:"relative",background:"#2C2C2E",borderRadius:"28px 28px 0 0",paddingBottom:"max(24px,env(safe-area-inset-bottom))"}}>
        <div style={{width:44,height:5,background:"#4A4A4E",borderRadius:3,margin:"14px auto 0"}}/>
        <div style={{padding:"16px 22px 10px",display:"flex",alignItems:"center",gap:14}}>
          <ProductImage img={item.img} icon={"📦"} size={60} radius={14}/>
          <div style={{flex:1}}>
            <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>{item.name}</div>
            {(item.brand||item.notes) && <div style={{fontSize:14,color:"#8E8E93",marginTop:2}}>{[item.brand,item.notes].filter(Boolean).join(" · ")}</div>}
            {item.buyNotes && <div style={{fontSize:12,color:"#0A84FF",marginTop:4,fontWeight:600}}>🔍 Searching: {[item.brand,item.name,item.buyNotes].filter(Boolean).join(" ")}</div>}
            <div style={{fontSize:12,color:"#636366",marginTop:4}}>Tap a store — opens app if installed</div>
          </div>
        </div>
        <div style={{padding:"6px 20px",display:"flex",flexDirection:"column",gap:10,maxHeight:"55vh",overflowY:"auto"}}>
          {show.length===0 && <div style={{padding:"24px 0",textAlign:"center",color:"#636366",fontSize:15}}>No stores saved — add via the 🏪 button</div>}
          {show.map(s=>(
            <button key={s.id} onClick={()=>{ onStoreChosen(item.id, s.id); openStore(s,item.name,item.brand,item.buyNotes); }}
              style={{display:"flex",alignItems:"center",gap:16,background:"#1C1C1E",borderRadius:18,padding:"16px 20px",minHeight:72,border:"none",width:"100%",cursor:"pointer",textAlign:"left"}}>
              <div style={{width:48,height:48,borderRadius:14,background:`${s.color}20`,border:`1.5px solid ${s.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{s.emoji}</div>
              <div style={{flex:1}}>
                <div style={{color:"#fff",fontWeight:800,fontSize:17}}>{s.name}</div>
                <div style={{color:"#8E8E93",fontSize:13,marginTop:2}}>{s.appUrl ? "🔗 Opens app" : "🌐 Opens website"} · {[item.brand,item.name].filter(Boolean).join(" ").slice(0,24)}</div>
              </div>
              <div style={{color:s.color,fontSize:26}}>›</div>
            </button>
          ))}
        </div>
        <div style={{padding:"12px 20px 0"}}>
          <button onClick={onClose} style={{width:"100%",padding:"17px",borderRadius:18,background:"#1C1C1E",border:"none",color:"#8E8E93",fontSize:17,fontWeight:700,cursor:"pointer"}}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── StoreManager ───────────────────────────────────────────────────────────────
function StoreManager({ myStores, setMyStores, customStores, setCustomStores, allSections, categoryStores, setCategoryStores, onClose }) {
  const [tab,      setTab]      = useState("mine");
  const [editingId,setEditingId]= useState(null);  // id of custom store being edited, or null for new
  const BLANK_FORM = {name:"",emoji:"🏬",color:"#0A84FF",url:""};
  const [form, setForm] = useState(BLANK_FORM);

  const allAvail = [...PRESET_STORES,...customStores];
  const mine     = myStores.map(id=>allAvail.find(s=>s.id===id)).filter(Boolean);
  const toggle   = id => setMyStores(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const sanitizeUrl = (raw) => {
    let u = (raw||"").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    if (!u.includes("{q}")) u = u + (u.includes("?") ? "&" : "?") + "q={q}";
    return u;
  };

  const startEdit = (s) => {
    setEditingId(s.id);
    setForm({name:s.name, emoji:s.emoji, color:s.color||"#0A84FF", url:s.url||""});
    setTab("custom");
  };

  const saveForm = () => {
    if (!form.name.trim()) return;
    const storeUrl = sanitizeUrl(form.url);
    if (editingId) {
      setCustomStores(p=>p.map(s=>s.id===editingId ? {...s,...form,url:storeUrl,appUrl:null} : s));
      setEditingId(null);
    } else {
      const id = "cx_"+Date.now();
      setCustomStores(p=>[...p,{...form,url:storeUrl,appUrl:null,id}]);
      setMyStores(p=>[...p,id]);
    }
    setForm(BLANK_FORM);
  };

  const deleteCustom = (id) => {
    setCustomStores(p=>p.filter(s=>s.id!==id));
    setMyStores(p=>p.filter(x=>x!==id));
    if (editingId===id) { setEditingId(null); setForm(BLANK_FORM); }
  };

  const iStyle={width:"100%",background:"#1C1C1E",border:"1.5px solid #3A3A3C",borderRadius:14,padding:"15px 18px",color:"#fff",fontSize:16,outline:"none",boxSizing:"border-box"};
  const lbl={fontSize:13,fontWeight:700,color:"#8E8E93",letterSpacing:".07em",textTransform:"uppercase",marginBottom:8,display:"block"};

  return (
    <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.65)"}} onClick={onClose}/>
      <div style={{position:"relative",background:"#2C2C2E",borderRadius:"28px 28px 0 0",maxHeight:"90vh",display:"flex",flexDirection:"column",paddingBottom:"max(20px,env(safe-area-inset-bottom))"}}>
        <div style={{width:44,height:5,background:"#4A4A4E",borderRadius:3,margin:"14px auto 0",flexShrink:0}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 22px 0",flexShrink:0}}>
          <div style={{fontSize:22,fontWeight:800,color:"#fff"}}>Stores</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#0A84FF",fontSize:18,fontWeight:800,cursor:"pointer"}}>Done</button>
        </div>
        <div style={{display:"flex",padding:"14px 22px 0",flexShrink:0,borderBottom:"1px solid #3A3A3C"}}>
          {[["mine","My Stores"],["browse","Add Stores"],["custom","Custom"]].map(([t,l])=>(
            <button key={t} onClick={()=>{setTab(t);setEditingId(null);setForm(BLANK_FORM);}}
              style={{flex:1,padding:"10px 6px 14px",background:"none",border:"none",borderBottom:`3px solid ${tab===t?"#0A84FF":"transparent"}`,color:tab===t?"#0A84FF":"#8E8E93",fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:-1}}>{l}</button>
          ))}
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
          {tab==="mine" && (
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {mine.length===0 && <div style={{textAlign:"center",padding:"40px 0",color:"#636366",fontSize:15}}>No stores yet — tap "Add Stores"</div>}
              {mine.map(s=>{
                const isCustom = customStores.some(c=>c.id===s.id);
                return (
                  <div key={s.id} style={{display:"flex",alignItems:"center",gap:12,background:"#1C1C1E",borderRadius:16,padding:"12px 14px"}}>
                    <div style={{width:44,height:44,borderRadius:13,background:`${s.color}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{s.emoji}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:16,fontWeight:700,color:"#fff"}}>{s.name}</div>
                      {isCustom && <div style={{fontSize:11,color:"#636366",marginTop:1}}>Custom store</div>}
                    </div>
                    {isCustom && (
                      <button onClick={()=>startEdit(s)}
                        style={{width:40,height:40,borderRadius:10,background:"#0A84FF15",border:"1px solid #0A84FF30",color:"#0A84FF",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        ✏️
                      </button>
                    )}
                    <button onClick={()=>isCustom ? deleteCustom(s.id) : toggle(s.id)}
                      style={{width:40,height:40,borderRadius:10,background:"#FF453A15",border:"1px solid #FF453A30",color:"#FF453A",fontSize:isCustom?14:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {isCustom ? "🗑" : "✕"}
                    </button>
                  </div>
                );
              })}
            </div>
          )}
          {tab==="browse" && (
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {allAvail.map(s=>{
                const on = myStores.includes(s.id);
                return (
                  <button key={s.id} onClick={()=>toggle(s.id)}
                    style={{display:"flex",alignItems:"center",gap:14,background:on?`${s.color}15`:"#1C1C1E",border:`2px solid ${on?s.color:"transparent"}`,borderRadius:16,padding:"14px 16px",cursor:"pointer",textAlign:"left"}}>
                    <div style={{width:46,height:46,borderRadius:14,background:`${s.color}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{s.emoji}</div>
                    <div style={{flex:1,fontSize:17,fontWeight:700,color:"#fff"}}>{s.name}</div>
                    <div style={{width:32,height:32,borderRadius:16,background:on?s.color:"#3A3A3C",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:16,flexShrink:0}}>{on?"✓":"+"}</div>
                  </button>
                );
              })}
            </div>
          )}
          {tab==="custom" && (
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              {/* Existing custom stores list */}
              {customStores.length > 0 && (
                <div>
                  <div style={{fontSize:12,fontWeight:700,color:"#636366",textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>Your Custom Stores</div>
                  <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
                    {customStores.map(s=>(
                      <div key={s.id} style={{display:"flex",alignItems:"center",gap:12,background:editingId===s.id?"#0A84FF15":"#1C1C1E",border:`1.5px solid ${editingId===s.id?"#0A84FF":"transparent"}`,borderRadius:14,padding:"12px 14px"}}>
                        <div style={{fontSize:22,width:36,textAlign:"center",flexShrink:0}}>{s.emoji}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:15,fontWeight:700,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</div>
                          <div style={{fontSize:11,color:"#636366",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.url||"No URL"}</div>
                        </div>
                        <button onClick={()=>editingId===s.id ? (setEditingId(null),setForm(BLANK_FORM)) : startEdit(s)}
                          style={{width:36,height:36,borderRadius:9,background:"#0A84FF15",border:"none",color:"#0A84FF",fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          {editingId===s.id?"✕":"✏️"}
                        </button>
                        <button onClick={()=>deleteCustom(s.id)}
                          style={{width:36,height:36,borderRadius:9,background:"#FF453A15",border:"none",color:"#FF453A",fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          🗑
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {/* Add / Edit form */}
              <div style={{fontSize:12,fontWeight:700,color:"#636366",textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>
                {editingId ? "Edit Store" : "Add New Store"}
              </div>
              <div><span style={lbl}>Store Name</span><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="e.g. H-E-B, Erewhon…" style={iStyle}/></div>
              <div>
                <span style={lbl}>Icon</span>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {["🛒","🎯","📦","🏪","🌿","💄","💅","💊","🛍","🌺","🌱","🏬","🧴","🍎","☕","🥩","🎁"].map(em=>(
                    <button key={em} onClick={()=>setForm(p=>({...p,emoji:em}))} style={{width:48,height:48,borderRadius:12,fontSize:22,cursor:"pointer",background:form.emoji===em?"#0A84FF30":"#1C1C1E",border:`2px solid ${form.emoji===em?"#0A84FF":"transparent"}`}}>{em}</button>
                  ))}
                </div>
              </div>
              <div>
                <span style={lbl}>Search URL <span style={{fontWeight:400,textTransform:"none",letterSpacing:0}}>(use {"{q}"} for search term)</span></span>
                <input value={form.url} onChange={e=>setForm(p=>({...p,url:e.target.value}))} placeholder="https://store.com/search?q={q}" style={{...iStyle,fontSize:14}}/>
                {form.url.trim() && (
                  <div style={{marginTop:8,padding:"8px 12px",background:"#1C1C1E",borderRadius:10,fontSize:12,color:"#636366"}}>
                    {form.url.includes("{q}")
                      ? <span style={{color:"#34D399"}}>✓ {form.url.replace("{q}","[item name]")}</span>
                      : <span style={{color:"#FBBF24"}}>⚠ No {"{q}"} — will auto-append ?q=[item name]</span>
                    }
                  </div>
                )}
              </div>
              <div style={{display:"flex",gap:10}}>
                {editingId && (
                  <button onClick={()=>{setEditingId(null);setForm(BLANK_FORM);}}
                    style={{flex:1,padding:"17px",borderRadius:16,background:"#3A3A3C",border:"none",color:"#8E8E93",fontSize:16,fontWeight:700,cursor:"pointer"}}>
                    Cancel
                  </button>
                )}
                <button onClick={saveForm}
                  style={{flex:2,padding:"17px",borderRadius:16,background:form.name.trim()?"#0A84FF":"#3A3A3C",border:"none",color:form.name.trim()?"#fff":"#636366",fontSize:17,fontWeight:800,cursor:form.name.trim()?"pointer":"default"}}>
                  {editingId ? "Save Changes" : "Add Store"}
                </button>
              </div>
            </div>
          )}
        {/* ── Category Store Preferences ── */}
        <div style={{padding:"16px 20px",borderTop:"1px solid #2C2C2E",marginTop:4}}>
          <div style={{fontSize:12,fontWeight:700,color:"#636366",textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>Default Store per Category</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {(allSections||[]).map(sec => {
              const allAvail2 = [...PRESET_STORES,...(customStores||[])].filter(s=>myStores.includes(s.id));
              const preferred = (categoryStores||{})[sec.id];
              const preferredStore = allAvail2.find(s=>s.id===preferred);
              return (
                <div key={sec.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0"}}>
                  <div style={{fontSize:18,width:26,flexShrink:0}}>{sec.icon}</div>
                  <div style={{flex:1,fontSize:13,fontWeight:700,color:"#fff"}}>{sec.label}</div>
                  <select
                    value={preferred||""}
                    onChange={e=>setCategoryStores(p=>{ const n={...p}; if(e.target.value) n[sec.id]=e.target.value; else delete n[sec.id]; return n; })}
                    style={{background:"#1C1C1E",border:"1px solid #3A3A3C",borderRadius:8,color:preferredStore?preferredStore.color:"#636366",fontSize:12,fontWeight:700,padding:"6px 8px",cursor:"pointer",maxWidth:120,outline:"none"}}>
                    <option value="">No default</option>
                    {allAvail2.map(s=>(

                    ))}
                  </select>
                </div>
              );
            })}
          </div>
        </div>
        </div>
      </div>
    </div>
  );
}
