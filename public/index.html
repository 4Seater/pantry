// ── ShopView — need-to-buy items grouped by store, with drag-to-move ──────────
function ShopView({ items, allStores, allSections, lastStore, categoryStores, onStoreChosen, onMarkBought, onEditItem, onClose }) {
  const needItems = items.filter(i => i.status === "out" || i.status === "low");

  // All drag state in a single ref to avoid stale closures — key fix for touch events
  const dragRef    = React.useRef({ active: false, item: null, fromStoreId: null, overStoreId: null });
  const [dragState, setDragState] = React.useState(null); // null | { item, fromStoreId, overStoreId, x, y }
  const longPressTimer = React.useRef(null);
  const containerRef = React.useRef(null);
  const storeRefs      = React.useRef({});

  // Resolve which store an item should show under:
  // 1. Manual lastStore override for this specific item
  // 2. Category-level preferred store (if that store is in item's allowed stores, or item has no stores)
  // 3. First store in item's stores list
  // 4. Unassigned
  const _catStores = categoryStores || {};
  const resolveStore = (item) => {
    const manual = (lastStore || {})[item.id];
    if (manual) return manual;
    const catPref = _catStores[item.section];
    if (catPref) return catPref;
    return item.stores?.[0] || null;
  };

  const storeGroups = allStores.map(store => ({
    store,
    items: needItems.filter(item => resolveStore(item) === store.id)
  })).filter(g => g.items.length > 0);

  const unassigned = needItems.filter(item => !resolveStore(item));
  const total = needItems.length;

  const storeAtPoint = (x, y) => {
    for (const [storeId, el] of Object.entries(storeRefs.current)) {
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return storeId;
    }
    return null;
  };

  // Pointer-event based drag — works on iOS Safari, Android Chrome, desktop
  // Using setPointerCapture so the element receives all pointer events even when finger moves away
  const startItemDrag = (item, storeId, e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    dragRef.current = { active: true, item, fromStoreId: storeId, overStoreId: null, pointerId: e.pointerId };
    setDragState({ item, fromStoreId: storeId, overStoreId: null, x: e.clientX, y: e.clientY });
    if (navigator.vibrate) navigator.vibrate(40);
  };

  const onPointerMove = (e) => {
    if (!dragRef.current.active) return;
    const over = storeAtPoint(e.clientX, e.clientY);
    dragRef.current.overStoreId = over;
    setDragState(prev => prev ? { ...prev, x: e.clientX, y: e.clientY, overStoreId: over } : prev);
  };

  const onPointerUp = (e) => {
    if (!dragRef.current.active) return;
    const target = storeAtPoint(e.clientX, e.clientY);
    if (target && target !== dragRef.current.fromStoreId) {
      onStoreChosen(dragRef.current.item.id, target);
      if (navigator.vibrate) navigator.vibrate([15, 20, 15]);
    }
    dragRef.current = { active: false, item: null, fromStoreId: null, overStoreId: null };
    setDragState(null);
  };

  const onItemLongPress = (item, storeId, e) => {
    // Long press via pointerdown held for 400ms
    const x = e.clientX, y = e.clientY;
    const el = e.currentTarget;
    longPressTimer.current = setTimeout(() => {
      dragRef.current = { active: true, item, fromStoreId: storeId, overStoreId: null };
      el.setPointerCapture(e.pointerId);
      setDragState({ item, fromStoreId: storeId, overStoreId: null, x, y });
      if (navigator.vibrate) navigator.vibrate(40);
    }, 400);
  };

  const onItemPointerUp = () => clearTimeout(longPressTimer.current);

  const ItemRow = ({ item, storeId }) => {
    const sec = allSections.find(s => s.id === item.section);
    const isGhosted = dragState?.item?.id === item.id;
    return (
      <div
        onPointerDown={e => onItemLongPress(item, storeId, e)}
        onPointerUp={onItemPointerUp}
        onPointerCancel={onItemPointerUp}
        style={{
          background: "#1C1C1E",
          borderRadius: 10,
          display: "flex",
          alignItems: "stretch",
          overflow: "hidden",
          opacity: isGhosted ? 0.3 : 1,
          marginBottom: 2,
          userSelect: "none",
          WebkitUserSelect: "none",
          WebkitTouchCallout: "none",
        }}>
        <div style={{width:34,display:"flex",alignItems:"center",justifyContent:"center",color:"#444",fontSize:15,flexShrink:0}}>⠿</div>
        <button
          onClick={() => { if (!dragRef.current.active) { onStoreChosen(item.id, storeId); openStore(allStores.find(s=>s.id===storeId), item.name, item.brand, item.buyNotes); }}}
          style={{flex:1,background:"none",border:"none",padding:"12px 8px 12px 0",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:10,minWidth:0}}>
          <ProductImage img={item.img} icon={sec?.icon||"📦"} size={36} radius={7}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:800,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
            <div style={{fontSize:11,color:"#8E8E93",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {[item.subcat||item.brand,item.buyNotes||item.notes].filter(Boolean).join(" · ")||" "}
            </div>
          </div>
        </button>
        {/* ✓ Bought — marks as ok, stamps lastBought, removes from shop list */}
        <button onClick={() => onMarkBought(item.id)}
          title="Mark as bought"
          style={{width:38,background:"none",border:"none",borderLeft:"1px solid #2C2C2E",color:"#34D399",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          ✓
        </button>
        <button onClick={() => onEditItem(item)}
          style={{width:38,background:"none",border:"none",borderLeft:"1px solid #2C2C2E",color:"#636366",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          ✏️
        </button>
      </div>
    );
  };

  const isDragging = !!dragState;

  return (
    <div ref={containerRef}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      style={{position:"fixed",inset:0,zIndex:600,background:"#000",display:"flex",flexDirection:"column",touchAction:"none"}}>
      {/* Header */}
      <div style={{paddingTop:"max(52px,env(safe-area-inset-top,20px))",paddingLeft:20,paddingRight:20,paddingBottom:16,background:"#000",borderBottom:"1px solid #1C1C1E",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:24,fontWeight:900}}>Shop 🛒</div>
            <div style={{fontSize:13,color:"#636366",marginTop:3}}>
              {total===0 ? "Nothing to buy" : `${total} item${total!==1?"s":""} · hold to drag between stores`}
            </div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#0A84FF",fontSize:18,fontWeight:800,cursor:"pointer",padding:"8px 4px"}}>Done</button>
        </div>
      </div>

      <div style={{flex:1,overflowY: isDragging ? "hidden" : "auto",padding:"16px 16px 40px"}}>
        {total===0 && (
          <div style={{textAlign:"center",padding:"80px 20px"}}>
            <div style={{fontSize:52,marginBottom:14}}>✅</div>
            <div style={{fontSize:20,fontWeight:800,color:"#8E8E93"}}>All stocked up!</div>
          </div>
        )}

        {storeGroups.map(({store, items:storeItems}) => {
          const isOver = dragState?.overStoreId === store.id && dragState?.fromStoreId !== store.id;
          return (
            <div key={store.id} ref={el=>storeRefs.current[store.id]=el} style={{marginBottom:20}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 4px 8px"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:10,background:`${store.color}20`,border:`2px solid ${isOver?store.color:store.color+"30"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,transition:"border-color .1s"}}>{store.emoji}</div>
                  <div>
                    <div style={{fontSize:15,fontWeight:800,color:store.color}}>{store.name}</div>
                    <div style={{fontSize:11,color:"#636366"}}>{storeItems.length} item{storeItems.length!==1?"s":""}</div>
                  </div>
                </div>
                <div style={{fontSize:11,color:"#636366"}}>{store.appUrl?"🔗 App":"🌐 Web"}</div>
              </div>
              <div style={{borderRadius:14,border:`2px dashed ${isOver?store.color:"transparent"}`,background:isOver?`${store.color}10`:"transparent",minHeight:isOver&&storeItems.length===0?52:0,transition:"all .1s",padding:isOver?"2px":"0"}}>
                {isOver && storeItems.length===0 && <div style={{textAlign:"center",padding:"12px",color:store.color,fontSize:13,fontWeight:700}}>Drop here</div>}
                {storeItems.map(item => <ItemRow key={item.id} item={item} storeId={store.id}/>)}
              </div>
            </div>
          );
        })}

        {unassigned.length > 0 && (
          <div ref={el=>storeRefs.current["unassigned"]=el} style={{marginBottom:24}}>
            <div style={{fontSize:12,fontWeight:700,color:"#636366",padding:"0 4px 8px",textTransform:"uppercase",letterSpacing:".06em"}}>No store assigned</div>
            {unassigned.map(item => <ItemRow key={item.id} item={item} storeId="unassigned"/>)}
          </div>
        )}
      </div>

      {/* Ghost card follows finger */}
      {dragState && (
        <div style={{position:"fixed",left:dragState.x-150,top:dragState.y-28,width:300,background:"#2C2C2E",borderRadius:14,padding:"11px 14px",display:"flex",alignItems:"center",gap:10,boxShadow:"0 12px 40px rgba(0,0,0,.8)",zIndex:9999,pointerEvents:"none",transform:"rotate(1.5deg) scale(1.05)"}}>
          <ProductImage img={dragState.item.img} icon={"📦"} size={34} radius={8}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,fontWeight:800,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{dragState.item.name}</div>
            {dragState.item.brand && <div style={{fontSize:11,color:"#8E8E93"}}>{dragState.item.brand}</div>}
          </div>
          {dragState.overStoreId && allStores.find(s=>s.id===dragState.overStoreId) && (
            <div style={{fontSize:11,color:"#34D399",fontWeight:700,flexShrink:0}}>→ {allStores.find(s=>s.id===dragState.overStoreId).name}</div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────────
function App() {
  const [items,          setItems]          = useState(()=>LS.get("p_items",   SEED));
  const [myStores,       setMyStores]       = useState(()=>LS.get("p_stores",  DEFAULT_STORES));
  const [customStores,   setCustomStores]   = useState(()=>LS.get("p_custom",  []));
  const [customSections, setCustomSections] = useState(()=>LS.get("p_custsec", []));
  const [aiEnabled,      setAiEnabled]      = useState(()=>LS.get("p_ai",      false));
  const [apiKey,         setApiKey]         = useState(()=>LS.get("p_apikey",  ""));
  // lastStore: { [itemId]: storeId } — remembers last store used per item
  const [lastStore,      setLastStore]      = useState(()=>LS.get("p_laststore", {}));
  // categoryStores: { [sectionId]: storeId } — preferred store per category
  const [categoryStores, setCategoryStores] = useState(()=>LS.get("p_catstores", {}));
  const [activeSection, setActiveSection] = useState("all");
  const [search,   setSearch]   = useState("");
  const [sheet,    setSheet]    = useState(null);
  const [sheetItem,setSheetItem]= useState(null);
  const [formDraft,setFormDraft]= useState(null);
  const [scanBusy, setScanBusy] = useState(false);

  useEffect(()=>{ LS.set("p_items",    items);          },[items]);
  useEffect(()=>{ LS.set("p_stores",   myStores);       },[myStores]);
  useEffect(()=>{ LS.set("p_custom",   customStores);   },[customStores]);
  useEffect(()=>{ LS.set("p_custsec",  customSections); },[customSections]);
  useEffect(()=>{ LS.set("p_ai",       aiEnabled);      },[aiEnabled]);
  useEffect(()=>{ LS.set("p_apikey",   apiKey);         },[apiKey]);
  useEffect(()=>{ LS.set("p_laststore",  lastStore);      },[lastStore]);
  useEffect(()=>{ LS.set("p_catstores", categoryStores); },[categoryStores]);


  const allSections = [...BUILTIN_SECTIONS, ...customSections];
  const allStores   = [
    ...PRESET_STORES.filter(s=>myStores.includes(s.id)),
    ...customStores.filter(s=>myStores.includes(s.id)),
  ];

  // Background image fetcher — on load, find items with a UPC but no img and fetch them quietly
  React.useEffect(() => {
    const missing = items.filter(i => i.upc && !i.img);
    if (!missing.length) return;
    let cancelled = false;
    (async () => {
      for (const item of missing) {
        if (cancelled) break;
        const result = await lookupUPC(item.upc, customSections);
        if (result?.img && !cancelled) {
          setItems(prev => prev.map(i => i.id === item.id ? { ...i, img: result.img } : i));
        }
        // Small delay to avoid hammering the API
        await new Promise(r => setTimeout(r, 300));
      }
    })();
    return () => { cancelled = true; };
  }, []); // only on mount

  // Manually fetch image for a single item by UPC or by name search
  const fetchImageForItem = async (item) => {
    if (item.upc) {
      const result = await lookupUPC(item.upc, customSections);
      if (result?.img) {
        setItems(prev => prev.map(i => i.id === item.id ? { ...i, img: result.img } : i));
        return true;
      }
    }
    // No UPC — try Open Food Facts text search
    try {
      const q = encodeURIComponent([item.brand, item.name].filter(Boolean).join(" "));
      const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${q}&search_simple=1&action=process&json=1&page_size=1`);
      const d = await r.json();
      const p = d.products?.[0];
      const img = p?.image_front_small_url || p?.image_front_url || p?.image_url || null;
      if (img) {
        setItems(prev => prev.map(i => i.id === item.id ? { ...i, img } : i));
        return true;
      }
    } catch(_) {}
    return false;
  };

  // Record which store was last used for an item, then open it
  const shopItem = useCallback((item) => {
    const itemStores = (item.stores||[]).map(id=>allStores.find(s=>s.id===id)).filter(Boolean);
    const pool = itemStores.length ? itemStores : allStores;
    const preferred = lastStore[item.id];
    const store = pool.find(s=>s.id===preferred) || pool[0];
    if (!store) { setSheetItem(item); setSheet("buy"); return; }
    // If only one store or we have a remembered preference, go straight there
    if (pool.length === 1 || preferred) {
      setLastStore(p=>({...p,[item.id]:store.id}));
      openStore(store, item.name, item.brand, item.buyNotes);
    } else {
      // Multiple stores, no preference yet — show picker
      setSheetItem(item); setSheet("buy");
    }
  }, [allStores, lastStore]);

  const saveItem   = item => setItems(p=>p.find(i=>i.id===item.id)?p.map(i=>i.id===item.id?item:i):[...p,item]);
  const deleteItem = id   => setItems(p=>p.filter(i=>i.id!==id));
  const addItems   = newItems => setItems(p=>[...p,...newItems]);
  const cycleStatus= item => setItems(p=>p.map(i=>i.id===item.id?{...i,status:NEXT_STATUS[i.status]}:i));

  const openScannerFromForm = useCallback((draft) => {
    setFormDraft(draft);
    setSheet("scanner_add");
  }, []);

  const handleScanStandalone = useCallback(async (code) => {
    setSheet(null); setScanBusy(true);
    const r = await lookupUPC(code, customSections);
    setSheetItem(r ? {...BLANK,...r,upc:code} : {...BLANK,upc:code});
    setScanBusy(false);
    setSheet("add");
  }, [customSections]);

  const handleScanFromForm = useCallback(async (code) => {
    setSheet(null); setScanBusy(true);
    const r = await lookupUPC(code, customSections);
    setSheetItem({
      ...(formDraft||BLANK), upc:code,
      name:  formDraft?.name  || r?.name  || "",
      brand: formDraft?.brand || r?.brand || "",
      section: r?.section || formDraft?.section || "pantry",
      notes: formDraft?.notes || r?.notes || "",
      img:   r?.img || formDraft?.img || null,
    });
    setFormDraft(null); setScanBusy(false);
    setSheet(formDraft?.id ? "edit" : "add");
  }, [formDraft, customSections]);

  const sectionsWithData = allSections.map(s=>({
    ...s,
    total:   items.filter(i=>i.section===s.id).length,
    needBuy: items.filter(i=>i.section===s.id&&(i.status==="low"||i.status==="out")).length,
  }));

  const filtered = items.filter(item=>{
    if (activeSection!=="all" && item.section!==activeSection) return false;
    if (search.trim()) {
      const q=search.toLowerCase();
      if (![item.name,item.brand??"",item.notes??""].join(" ").toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const grouped = activeSection==="all"
    ? allSections.map(s=>({sec:s,items:filtered.filter(i=>i.section===s.id)})).filter(g=>g.items.length>0)
    : [{sec:allSections.find(s=>s.id===activeSection)||allSections[0], items:filtered}];

  // For a focused section, build subcat groups (only subcats that have items)
  const subcatGroups = activeSection !== "all"
    ? (() => {
        const subcats = SUBCATEGORIES[activeSection] || [];
        const groups = subcats
          .map(sc => ({ label: sc, items: filtered.filter(i => i.subcat === sc) }))
          .filter(g => g.items.length > 0);
        const ungrouped = filtered.filter(i => !i.subcat || !(SUBCATEGORIES[activeSection]||[]).includes(i.subcat));
        if (ungrouped.length) groups.push({ label: null, items: ungrouped });
        return groups;
      })()
    : null;

  const needCount = items.filter(i=>i.status==="out").length;
  const lowCount  = items.filter(i=>i.status==="low").length;

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{background:#000;font-family:'Nunito',sans-serif;color:#fff;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
        input,button{font-family:'Nunito',sans-serif;}
        input::placeholder{color:#4A4A4E;}
        ::-webkit-scrollbar{display:none;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes spin{to{transform:rotate(360deg)}}
      `}</style>

      <div style={{minHeight:"100dvh",background:"#000",maxWidth:430,margin:"0 auto",paddingBottom:110,paddingTop:"env(safe-area-inset-top,0px)"}}>

        {/* Header */}
        <div style={{padding:"20px 20px 14px",position:"sticky",top:0,background:"#000",zIndex:50}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div>
              <div style={{fontSize:30,fontWeight:900,letterSpacing:"-0.02em"}}>Pantry 🧺</div>
              <div style={{fontSize:14,color:"#636366",marginTop:3}}>
                {items.length} items

              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              {/* AI suggestions — only when AI enabled */}
              {aiEnabled && (
                <button onClick={()=>setSheet("suggestions")}
                  title="Get suggestions"
                  style={{width:46,height:46,borderRadius:14,background:"#7C3AED20",border:"1.5px solid #7C3AED60",color:"#fff",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  💡
                </button>
              )}
              {/* AI / Settings toggle */}
              <button onClick={()=>setSheet("settings")}
                title="AI Settings"
                style={{width:46,height:46,borderRadius:14,background:aiEnabled?"#7C3AED":"#1C1C1E",border:`1.5px solid ${aiEnabled?"#A855F7":"#3A3A3C"}`,color:"#fff",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                ✨
              </button>
              {/* Category manager */}
              <button onClick={()=>setSheet("categories")}
                style={{width:46,height:46,borderRadius:14,background:"#1C1C1E",border:"none",color:"#fff",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                🏷
              </button>
              {/* Store manager */}
              <button onClick={()=>setSheet("stores")}
                style={{width:46,height:46,borderRadius:14,background:"#1C1C1E",border:"none",color:"#fff",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                🏪
              </button>
            </div>
          </div>
          <div style={{position:"relative"}}>
            <div style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:16,pointerEvents:"none"}}>🔍</div>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search everything…"
              style={{width:"100%",background:"#1C1C1E",border:"none",borderRadius:14,padding:"14px 40px 14px 42px",color:"#fff",fontSize:16,outline:"none"}}/>
            {search && <button onClick={()=>setSearch("")} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"#3A3A3C",border:"none",borderRadius:10,width:26,height:26,color:"#8E8E93",fontSize:14,cursor:"pointer"}}>✕</button>}
          </div>
        </div>

        {/* Section pills */}
        <div style={{display:"flex",gap:8,padding:"0 20px 16px",overflowX:"auto"}}>
          <button onClick={()=>setActiveSection("all")} style={{flexShrink:0,padding:"10px 18px",borderRadius:50,background:activeSection==="all"?"#fff":"#1C1C1E",border:"none",color:activeSection==="all"?"#000":"#8E8E93",fontSize:15,fontWeight:700,cursor:"pointer"}}>All</button>
          {sectionsWithData.filter(s=>s.total>0||s.id===activeSection).map(s=>(
            <button key={s.id} onClick={()=>setActiveSection(s.id)}
              style={{flexShrink:0,padding:"10px 14px",borderRadius:50,background:activeSection===s.id?s.accent:"#1C1C1E",border:"none",color:activeSection===s.id?"#000":"#8E8E93",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
              <span>{s.icon}</span>{s.label}
              {s.needBuy>0 && <span style={{background:activeSection===s.id?"rgba(0,0,0,.25)":"#F87171",color:"#fff",borderRadius:10,padding:"1px 6px",fontSize:11,fontWeight:800}}>{s.needBuy}</span>}
            </button>
          ))}
        </div>

        {filtered.length===0 && (
          <div style={{textAlign:"center",padding:"60px 20px",color:"#636366"}}>
            <div style={{fontSize:52,marginBottom:14}}>📭</div>
            <div style={{fontSize:20,fontWeight:800,color:"#8E8E93",marginBottom:8}}>{search?"No matches":"Nothing here yet"}</div>
            <div style={{fontSize:15}}>{search?"Try a different search":"Tap + Add Item to get started"}</div>
          </div>
        )}

        {grouped.map(({sec:gSec,items:gItems})=>{
          // Helper to render a single item card
          const renderItem = (item, idx, arr) => {
            const st  = STATUS_CFG[item.status]||STATUS_CFG.ok;
            const sec = allSections.find(s=>s.id===item.section);
            const only=arr.length===1, first=idx===0, last=idx===arr.length-1;
            const br  = only?"18px":first?"18px 18px 6px 6px":last?"6px 6px 18px 18px":"6px";
            return (
              <div key={item.id} style={{background:"#1C1C1E",borderRadius:br,overflow:"hidden",display:"flex",alignItems:"stretch"}}>
                <div style={{width:4,background:st.color,flexShrink:0}}/>
                <button onClick={()=>{setSheetItem(item);setSheet("buy");}}
                  style={{flex:1,background:"none",border:"none",padding:"12px 14px",textAlign:"left",cursor:"pointer",minWidth:0,display:"flex",alignItems:"center",gap:12}}>
                  <ProductImage img={item.img} icon={sec?.icon||"📦"} size={48} radius={10}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:15,fontWeight:800,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                    <div style={{fontSize:12,color:"#8E8E93",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{[item.brand,item.notes].filter(Boolean).join(" · ")||" "}</div>
                  </div>
                </button>
                <div style={{display:"flex",flexDirection:"column",borderLeft:"1px solid #2C2C2E",flexShrink:0}}>
                  <button onClick={()=>setItems(p=>p.map(i=>i.id===item.id?{...i,status:i.status==="out"?"ok":"out"}:i))}
                    title={item.status==="out"?"Remove from shop list":"Add to shop list"}
                    style={{flex:1,width:56,background:item.status==="out"?"#F8717120":"none",border:"none",borderBottom:"1px solid #2C2C2E",color:item.status==="out"?"#F87171":"#636366",fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>
                    🛒
                  </button>
                  <button onClick={()=>{setSheetItem(item);setSheet("edit");}}
                    style={{flex:1,width:56,background:"none",border:"none",color:"#8E8E93",fontSize:17,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                    ✏️
                  </button>
                </div>
              </div>
            );
          };

          // When viewing all sections → flat list per section (no subcat headers)
          if (activeSection === "all") {
            return (
              <div key={gSec.id} style={{marginBottom:24,animation:"fadeUp .2s ease"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 20px 10px"}}>
                  <div style={{width:34,height:34,borderRadius:10,background:gSec.bg||"#141414",border:`1px solid ${gSec.accent}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{gSec.icon}</div>
                  <div style={{fontSize:16,fontWeight:800,color:gSec.accent}}>{gSec.label}</div>
                  <div style={{fontSize:13,color:"#636366",fontWeight:600}}>{gItems.length} item{gItems.length!==1?"s":""}</div>
                </div>
                <div style={{padding:"0 16px",display:"flex",flexDirection:"column",gap:2}}>
                  {gItems.map((item,idx)=>renderItem(item,idx,gItems))}
                </div>
              </div>
            );
          }

          // When a section is focused → group by subcategory
          return (
            <div key={gSec.id} style={{marginBottom:8,animation:"fadeUp .2s ease"}}>
              {subcatGroups && subcatGroups.map(({label, items:scItems}) => (
                <div key={label||"__none"} style={{marginBottom:20}}>
                  {label && (
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"0 20px 8px"}}>
                      <div style={{flex:1,height:1,background:"#2C2C2E"}}/>
                      <div style={{fontSize:12,fontWeight:800,color:"#636366",textTransform:"uppercase",letterSpacing:".06em",flexShrink:0}}>{label}</div>
                      <div style={{flex:1,height:1,background:"#2C2C2E"}}/>
                      <div style={{fontSize:11,color:"#4A4A4E",flexShrink:0}}>{scItems.length}</div>
                    </div>
                  )}
                  {!label && scItems.length > 0 && (
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"0 20px 8px"}}>
                      <div style={{flex:1,height:1,background:"#2C2C2E"}}/>
                      <div style={{fontSize:12,fontWeight:800,color:"#4A4A4E",textTransform:"uppercase",letterSpacing:".06em"}}>Other</div>
                      <div style={{flex:1,height:1,background:"#2C2C2E"}}/>
                    </div>
                  )}
                  <div style={{padding:"0 16px",display:"flex",flexDirection:"column",gap:2}}>
                    {scItems.map((item,idx)=>renderItem(item,idx,scItems))}
                  </div>
                </div>
              ))}
            </div>
          );
        })}


      </div>

      {/* FAB */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,padding:"12px 20px",paddingBottom:"max(16px,env(safe-area-inset-bottom))",background:"linear-gradient(transparent,#000 40%)",display:"flex",gap:10,zIndex:100}}>
        {aiEnabled && (
          <button onClick={()=>setSheet("ai")}
            style={{flex:1,height:56,borderRadius:18,background:"#7C3AED",border:"none",color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            ✨ Scan
          </button>
        )}
        <button onClick={()=>setSheet("scanner_standalone")}
          style={{flex:1,height:56,borderRadius:18,background:"#1C1C1E",border:"1.5px solid #3A3A3C",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontWeight:800,fontSize:14}}>
          <ScanIcon size={20} color="#fff"/> Barcode
        </button>
        {/* Shop button — shows count badge if items need buying */}
        <button onClick={()=>setSheet("shop")}
          style={{flex:1,height:56,borderRadius:18,background:items.some(i=>i.status==="out"||i.status==="low")?"#34D399":"#1C1C1E",border:"none",color:items.some(i=>i.status==="out"||i.status==="low")?"#000":"#636366",fontSize:14,fontWeight:800,cursor:"pointer",position:"relative",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          🛒 Shop
          {items.filter(i=>i.status==="out"||i.status==="low").length > 0 && (
            <div style={{position:"absolute",top:-6,right:-4,background:"#F87171",borderRadius:10,minWidth:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#fff",padding:"0 5px"}}>
              {items.filter(i=>i.status==="out"||i.status==="low").length}
            </div>
          )}
        </button>
        <button onClick={()=>{setSheetItem(null);setFormDraft(null);setSheet("add");}}
          style={{flex:1,height:56,borderRadius:18,background:"#0A84FF",border:"none",color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer"}}>
          + Add
        </button>
      </div>

      {/* Scanners */}
      {sheet==="scanner_standalone" && <Scanner onResult={handleScanStandalone} onClose={()=>setSheet(null)}/>}
      {sheet==="scanner_add"        && <Scanner onResult={handleScanFromForm}   onClose={()=>{setSheet(formDraft?.id?"edit":"add"); setSheetItem(formDraft);}}/>}

      {/* Add/Edit */}
      {(sheet==="add"||sheet==="edit") && (
        <ItemSheet
          existing={sheet==="edit" ? sheetItem : (sheetItem?.upc||sheetItem?.name ? sheetItem : null)}
          allStores={allStores}
          allSections={allSections}
          onSave={saveItem}
          onDelete={deleteItem}
          onClose={()=>{setSheet(null);setSheetItem(null);setFormDraft(null);}}
          onOpenScanner={(draft)=>openScannerFromForm(draft)}
        />
      )}

      {sheet==="buy" && sheetItem && <BuySheet item={sheetItem} allStores={allStores} onClose={()=>{setSheet(null);setSheetItem(null);}} onStoreChosen={(itemId,storeId)=>setLastStore(p=>({...p,[itemId]:storeId}))}/>}
      {sheet==="stores" && <StoreManager myStores={myStores} setMyStores={setMyStores} customStores={customStores} setCustomStores={setCustomStores} allSections={allSections} categoryStores={categoryStores} setCategoryStores={setCategoryStores} onClose={()=>setSheet(null)}/>}
      {sheet==="categories" && <CategoryManager customSections={customSections} setCustomSections={setCustomSections} onClose={()=>setSheet(null)}/>}
      {sheet==="ai" && <AIVisionSheet allSections={allSections} onAddItems={addItems} onClose={()=>setSheet(null)} apiKey={apiKey}/>}
      {sheet==="settings" && <SettingsSheet apiKey={apiKey} setApiKey={setApiKey} aiEnabled={aiEnabled} setAiEnabled={setAiEnabled} onClose={()=>setSheet(null)}/>}
      {sheet==="suggestions" && <InventorySuggestionsSheet items={items} allSections={allSections} onClose={()=>setSheet(null)} apiKey={apiKey}/>}
      {sheet==="shop" && <ShopView items={items} allStores={allStores} allSections={allSections} lastStore={lastStore} categoryStores={categoryStores} onStoreChosen={(itemId,storeId)=>setLastStore(p=>({...p,[itemId]:storeId}))} onMarkBought={(itemId)=>setItems(p=>p.map(i=>i.id===itemId?{...i,status:"ok",lastBought:new Date().toISOString()}:i))} onEditItem={(item)=>{setSheetItem(item);setSheet("edit");}} onClose={()=>setSheet(null)}/>}

      {scanBusy && (
        <div style={{position:"fixed",inset:0,zIndex:900,background:"rgba(0,0,0,.75)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
          <div style={{width:52,height:52,border:"4px solid rgba(255,255,255,.15)",borderTop:"4px solid #0A84FF",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
          <div style={{fontSize:16,fontWeight:700,color:"rgba(255,255,255,.7)"}}>Looking up product…</div>
        </div>
      )}
    </>
  );
}
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
